name: Smoke test (deployed demo)
on:
  workflow_dispatch:
  push:
    branches: [smoke]
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p shots && node tests/smoke.mjs
        env:
          BASE_URL: https://realcareportal.vercel.app
          SHOTS: shots
      - if: always()
        name: Commit screenshots to the smoke-shots branch
        run: |
          cd shots && git init -q && git checkout -q -b smoke-shots && git add . && git -c user.name=ci -c user.email=ci@example.com commit -qm "screenshots ${GITHUB_SHA}" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" smoke-shots
